<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ambev · Painel de Relacionamento com Imprensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ambev:#1B2E86; --ambev-d:#101C57; --ambev-l:#5E77D8; --ambev-xl:#E7EBF9;
  --ink:#0D1424; --body:#39415A; --mute:#7C86A2;
  --paper:#FFFFFF; --mist:#F4F6FB; --rule:#DCE2F0;
  --ok:#1B2E86; --sent:#7C90DC; --no:#C2415F; --none:#A9B2C9;
  --wip:#B4801A; --wip-bg:#FBF3E2;
  --r:3px;
  --sp:clamp(20px,3.4vw,44px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  font-family:Montserrat,system-ui,sans-serif;
  background:var(--mist); color:var(--body);
  font-size:14px; line-height:1.55;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
a{color:var(--ambev);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ambev);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:10px;font-weight:800;letter-spacing:.20em;text-transform:uppercase;color:var(--mute)}
.num{font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;z-index:200;background:var(--ambev-d);display:flex;align-items:center;justify-content:center;padding:24px}
#gate .box{width:min(430px,100%);text-align:center}
#gate img.ip{width:132px;margin:0 auto 40px;display:block;opacity:.95}
#gate h1{font-size:15px;font-weight:700;color:#fff;letter-spacing:.01em;margin-bottom:6px}
#gate p{font-size:12px;color:#A9B6E8;margin-bottom:26px}
#gate .field{display:flex;gap:8px}
#gate input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.22);color:#fff;padding:13px 15px;border-radius:var(--r);font-size:14px}
#gate input::placeholder{color:#8D9BD4}
#gate button{background:#fff;color:var(--ambev-d);border:0;padding:13px 22px;border-radius:var(--r);font-weight:700;font-size:13px;cursor:pointer}
#gate button:hover{background:var(--ambev-xl)}
#gate .err{color:#FF9DB4;font-size:12px;margin-top:14px;min-height:16px;font-weight:600}
#gate .foot{margin-top:46px;font-size:10px;color:#6E7DBB;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ---------- SHELL ---------- */
#app{display:none}
#app.on{display:block}
header.top{background:var(--ambev-d);color:#fff;padding:0 var(--sp);position:sticky;top:0;z-index:60}
.top .in{display:flex;align-items:center;gap:22px;height:66px;max-width:1580px;margin:0 auto}
@media(max-width:640px){.top .in{gap:12px;height:58px}.top .ttl,.top .v{display:none}.top img.ip{height:24px}nav.tabs{top:58px}}
.top img.amb{height:20px;filter:brightness(0) invert(1);opacity:.96}
.top .div{width:1px;height:26px;background:rgba(255,255,255,.24)}
.top .ttl{font-size:12.5px;font-weight:600;letter-spacing:.02em}
.top .ttl b{font-weight:800}
.top .ttl span{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#93A2E0;margin-top:2px}
.top .sp{flex:1}
.top img.ip{height:30px;filter:brightness(0) invert(1);opacity:.9}
.top .v{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:100px}

nav.tabs{background:var(--ambev);position:sticky;top:66px;z-index:55;padding:0 var(--sp);overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs .in{display:flex;gap:2px;max-width:1580px;margin:0 auto}
nav.tabs button{background:none;border:0;color:#B9C4EE;padding:14px 16px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
nav.tabs .dot{width:5px;height:5px;border-radius:50%;background:#E8B54B}

main{max-width:1580px;margin:0 auto;padding:var(--sp) var(--sp) 80px}
.page{display:none}
.page.on{display:block}

.phead{margin-bottom:26px;padding-bottom:18px;border-bottom:2px solid var(--ink);display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.phead h2{font-size:clamp(21px,2.4vw,29px);font-weight:800;color:var(--ink);letter-spacing:-.022em;line-height:1.1}
.phead p{font-size:13px;color:var(--body);max-width:64ch;margin-top:7px}
.phead .sp{flex:1;min-width:0}

/* ---------- CARDS ---------- */
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1fr 2fr}
@media(max-width:1080px){.g3,.g4,.g23,.g32{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:1fr!important}}
.mb{margin-bottom:14px}
.mb2{margin-bottom:26px}

.card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:18px 20px 20px}
.card>h3{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.005em;margin-bottom:2px}
.card>.sub{font-size:11px;color:var(--mute);margin-bottom:16px;line-height:1.45}
.card .ch{display:flex;align-items:flex-start;gap:12px;margin-bottom:15px}
.card .ch .sp{flex:1;min-width:0}

.kpi{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:17px 18px}
.kpi .l{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
.kpi .n{font-size:33px;line-height:1;font-weight:800;letter-spacing:-.035em;color:var(--ink)}
.kpi .n em{font-style:normal;font-size:15px;font-weight:700;color:var(--mute);letter-spacing:0}
.kpi .d{font-size:11px;color:var(--mute);margin-top:8px;line-height:1.4}
.kpi.hi{background:var(--ambev-d);border-color:var(--ambev-d)}
.kpi.hi .l{color:#95A4E4}.kpi.hi .n{color:#fff}.kpi.hi .d{color:#B4C0EC}

.btn{background:var(--paper);border:1px solid var(--rule);color:var(--body);padding:6px 11px;border-radius:var(--r);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ambev);color:var(--ambev);background:var(--ambev-xl)}
.exp{display:flex;gap:5px;flex-shrink:0}

/* ---------- BARS ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(80px,34%) 1fr auto;gap:11px;align-items:center;font-size:11.5px}
.bar .lb{color:var(--body);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .lb b{font-weight:700;color:var(--ink)}
.bar .tr{background:var(--mist);height:17px;border-radius:2px;overflow:hidden;display:flex}
.bar .fl{height:100%;transition:width .5s cubic-bezier(.22,1,.36,1)}
.bar .vv{font-weight:800;color:var(--ink);font-size:11.5px;min-width:30px;text-align:right}
.bar.clk{cursor:pointer}
.bar.clk:hover .lb b{color:var(--ambev);text-decoration:underline}

.lgd{display:flex;gap:15px;flex-wrap:wrap;margin-top:15px;padding-top:13px;border-top:1px solid var(--rule)}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}
.lgd span{font-size:10.5px;color:var(--mute);font-weight:600}

/* ---------- TABLE ---------- */
.tw{overflow:auto;max-height:460px;margin:0 -20px -20px;border-top:1px solid var(--rule);max-width:calc(100% + 40px)}
.card>.tw table{min-width:0}
@media(max-width:640px){.dstat{grid-template-columns:repeat(2,1fr)}.card{padding:16px 14px 16px}.tw{margin:0 -14px -16px;max-width:calc(100% + 28px)}}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;background:var(--mist);text-align:left;padding:10px 12px;font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--rule);white-space:nowrap;z-index:2}
td{padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover{background:var(--ambev-xl)}
td.n{text-align:right;font-weight:700;color:var(--ink)}
.nm{font-weight:700;color:var(--ink);cursor:pointer}
.nm:hover{color:var(--ambev);text-decoration:underline}
.sm{color:var(--mute);font-size:10.5px}

.tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--mist);color:var(--mute);border:1px solid var(--rule);white-space:nowrap}
.tag.idm{background:var(--ambev-xl);color:var(--ambev);border-color:#C2CDF2}
.tag.mc{background:#EAF3EC;color:#2C6B45;border-color:#CADFD1}
.tag.ok{background:var(--ambev-xl);color:var(--ambev);border-color:#C2CDF2}
.tag.no{background:#FBEBEF;color:var(--no);border-color:#F2CFD8}
.tag.w{background:var(--wip-bg);color:var(--wip);border-color:#EFDDB6}

.note{background:var(--wip-bg);border:1px solid #EFDDB6;border-left:3px solid var(--wip);border-radius:var(--r);padding:13px 16px;font-size:11.5px;color:#6A4E10;line-height:1.5}
.note b{color:#503A08;font-weight:800}

/* ---------- SIGNATURE: recomendador ---------- */
.rec{background:var(--ambev-d);border-radius:var(--r);padding:24px;color:#fff}
.rec .q{font-size:clamp(17px,2vw,23px);font-weight:800;letter-spacing:-.02em;line-height:1.25;margin-bottom:5px}
.rec .qs{font-size:12px;color:#A9B6E8;margin-bottom:20px;max-width:66ch}
.rec .ctl{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px}
.rec select{max-width:100%}
@media(max-width:560px){.rec .ctl>div{flex:1 1 100%}.rec select{width:100%;min-width:0}}
.rec label{display:block;font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8FA0E2;margin-bottom:6px}
.rec select{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.24);color:#fff;padding:9px 11px;border-radius:var(--r);font-size:12px;font-weight:600;min-width:150px}
.rec select option{background:var(--ambev-d)}
.rec .dis{opacity:.42}
.rl{margin-top:18px;display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.14);border-radius:var(--r);overflow:hidden}
.ri{display:grid;grid-template-columns:26px 1fr 178px 46px;gap:12px;align-items:center;background:var(--ambev-d);padding:11px 13px;cursor:pointer}
@media(max-width:720px){.ri{grid-template-columns:24px 1fr 44px}.ri .mt{display:none}}
.ri:hover{background:#17246B}
.ri .rk{font-size:12px;font-weight:800;color:#8FA0E2}
.ri .nn{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .vv{font-size:10.5px;color:#A9B6E8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri .mt{font-size:9.5px;color:#8FA0E2;text-align:right;line-height:1.45}
.ri .sc{font-size:17px;font-weight:800;color:#fff;text-align:right;letter-spacing:-.02em}
.rf{margin-top:14px;font-size:10.5px;color:#8FA0E2;line-height:1.55}

/* ---------- DRAWER ---------- */
#ov{position:fixed;inset:0;background:rgba(13,20,36,.5);z-index:100;opacity:0;pointer-events:none;transition:opacity .22s}
#ov.on{opacity:1;pointer-events:auto}
#dw{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:101;transform:translateX(101%);transition:transform .3s cubic-bezier(.22,1,.36,1);overflow-y:auto;box-shadow:-14px 0 44px rgba(13,20,36,.16)}
#dw.on{transform:none}
.dh{background:var(--ambev-d);color:#fff;padding:22px 26px}
.dh .x{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.14);border:0;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1}
.dh .x:hover{background:rgba(255,255,255,.28)}
.dh h4{font-size:19px;font-weight:800;letter-spacing:-.02em;padding-right:38px;line-height:1.2}
.dh .v{font-size:12px;color:#A9B6E8;margin-top:4px}
.dh .tg{display:flex;gap:6px;margin-top:13px;flex-wrap:wrap}
.dh .tg .tag{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.24);color:#fff}
.db{padding:22px 26px 60px}
.dsec{margin-bottom:24px}
.dsec>h5{font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--mute);margin-bottom:11px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.dstat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:480px){.dstat{grid-template-columns:repeat(2,1fr)}}
.dstat div{background:var(--mist);border-radius:var(--r);padding:11px}
.dstat .n{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1}
.dstat .l{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.tl{position:relative;padding-left:17px}
.tl:before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:1px;background:var(--rule)}
.tli{position:relative;padding:0 0 13px}
.tli:before{content:"";position:absolute;left:-17px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--ambev-l);border:2px solid var(--paper)}
.tli.a:before{background:var(--ok)}.tli.d:before{background:var(--no)}.tli.x:before{background:var(--none)}
.tli .t{font-size:12px;font-weight:700;color:var(--ink)}
.tli .m{font-size:10.5px;color:var(--mute);margin-top:2px}
.empty{background:var(--mist);border-radius:var(--r);padding:16px;font-size:11.5px;color:var(--mute);line-height:1.5}

/* ---------- WIP page ---------- */
.wipwrap{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(26px,4vw,52px)}
.wipwrap .badge{display:inline-flex;align-items:center;gap:8px;background:var(--wip-bg);border:1px solid #EFDDB6;color:var(--wip);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:100px;margin-bottom:20px}
.wipwrap .badge i{width:6px;height:6px;border-radius:50%;background:var(--wip);animation:pl 1.9s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.25}}
.wipwrap h3{font-size:clamp(20px,2.6vw,30px);font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.15;max-width:22ch;margin-bottom:12px}
.wipwrap>p{font-size:13.5px;max-width:62ch;line-height:1.6}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:30px}
@media(max-width:820px){.prev{grid-template-columns:1fr}}
.prev div{border:1px dashed var(--rule);border-radius:var(--r);padding:18px;background:var(--mist)}
.prev .k{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
.prev .t{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;letter-spacing:-.01em}
.prev .d{font-size:11.5px;color:var(--body);line-height:1.5}
.ghost{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.ghost i{display:block;height:7px;border-radius:2px;background:linear-gradient(90deg,var(--rule),#EDF0F8);}
.ghost i:nth-child(2){width:74%}.ghost i:nth-child(3){width:52%}

/* ---------- progresso ---------- */
.pgl{display:flex;flex-direction:column;gap:13px}
.pg .r{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px}
.pg .r b{color:var(--ink);font-weight:700}
.pg .r span{color:var(--mute);font-weight:600}
.pg .t{height:6px;background:var(--mist);border-radius:100px;overflow:hidden}
.pg .f{height:100%;background:var(--ambev);border-radius:100px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.pg .f.w{background:var(--wip)}

footer{border-top:1px solid var(--rule);padding:22px var(--sp) 46px;background:var(--paper)}
footer .in{max-width:1580px;margin:0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
main,.card,.tw{max-width:100%}
footer img{height:26px;opacity:.5}
footer p{font-size:10.5px;color:var(--mute);line-height:1.6}
footer .sp{flex:1}
.filt{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.filt select{background:var(--paper);border:1px solid var(--rule);color:var(--body);padding:7px 10px;border-radius:var(--r);font-size:11.5px;font-weight:600}
.filt select[multiple]{padding:4px;font-weight:500;max-width:100%}
.filt{max-width:100%}
.filt>div{max-width:100%}
@media(max-width:640px){.filt{flex-direction:column;align-items:stretch}.filt select,.filt .srch,.filt>div,.filt select[multiple]{width:100%;min-width:0}}
.filt select[multiple] option{padding:3px 6px;border-radius:2px}
.filt select:disabled{opacity:.5;cursor:not-allowed}
.srch{background:var(--paper);border:1px solid var(--rule);padding:8px 12px;border-radius:var(--r);font-size:12px;min-width:210px}
/* ---------- filtro de ano no cabeçalho ---------- */
.top .anow{display:flex;align-items:center;gap:7px}
.top .anow label{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#93A2E0}
.top select.ano{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);color:#fff;
  padding:6px 9px;border-radius:var(--r);font-size:11.5px;font-weight:700;cursor:pointer}
.top select.ano option{background:var(--ambev-d);color:#fff}
@media(max-width:720px){.top .anow label{display:none}}
#anoAviso{display:none;background:var(--wip-bg);border:1px solid #EFDDB6;border-left:3px solid var(--wip);
  border-radius:var(--r);padding:11px 15px;font-size:11.5px;color:#6A4E10;line-height:1.5;margin-bottom:16px}
#anoAviso b{color:#503A08;font-weight:800}

/* ---------- PAPER ---------- */
.pbar .filt{align-items:flex-start}
.pbar select{background:var(--paper);border:1px solid var(--rule);color:var(--body);padding:8px 11px;
  border-radius:var(--r);font-size:12.5px;font-weight:600;max-width:100%}
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:clamp(22px,3.4vw,42px)}
.pcab{display:flex;align-items:center;gap:18px;padding-bottom:18px;border-bottom:2px solid var(--ambev-d);margin-bottom:24px}
.pcab .sp{flex:1}
.pcab img.pamb{height:22px}
.pcab img.pip{height:28px;opacity:.78}
.pcab-t{text-align:right;line-height:1.35}
.pcab-t b{display:block;font-size:11px;font-weight:800;color:var(--ink);letter-spacing:.01em}
.pcab-t span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.pident{margin-bottom:22px}
.pnome{font-size:clamp(23px,3vw,33px);font-weight:800;color:var(--ink);letter-spacing:-.028em;line-height:1.1}
.pveic{font-size:13px;color:var(--body);font-weight:600;margin-top:5px}
.ptags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pmud{margin-top:13px;background:var(--wip-bg);border:1px solid #EFDDB6;border-radius:var(--r);
  padding:10px 13px;font-size:11.5px;color:#6A4E10;line-height:1.5}
.pmud b{color:#503A08}
.pnum{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:26px}
.pnum>div{background:var(--mist);padding:14px 12px;text-align:center}
.pnum b{display:block;font-size:25px;font-weight:800;color:var(--ink);letter-spacing:-.035em;line-height:1}
.pnum span{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.psec{margin-bottom:26px}
.psec>h4{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ambev);
  padding-bottom:8px;border-bottom:1px solid var(--rule);margin-bottom:14px;display:flex;align-items:baseline;gap:9px}
.psec .pcount{font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--mute);text-transform:none}
.psec p{font-size:12.5px;line-height:1.65;margin-bottom:9px;color:var(--body)}
.psec p b{color:var(--ink);font-weight:700}
.pvazio{color:var(--mute)!important;font-style:italic;font-size:11.5px!important}
.patt{background:#FBEBEF;border-left:3px solid var(--no);border-radius:2px;padding:9px 13px;color:#7A2338!important}
.pgrid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
@media(max-width:760px){.pgrid2{grid-template-columns:1fr;gap:0}}
.ptagl{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.ptag{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:100px;border:1px solid}
.ptag.int{background:var(--ambev-xl);color:var(--ambev);border-color:#C2CDF2}
.ptag.time{background:#EAF3EC;color:#2C6B45;border-color:#CADFD1}
.ptag.marca{background:#F4EEFA;color:#5C3A86;border-color:#DCCDEC}
.ptag.rest{background:var(--wip-bg);color:#8A6212;border-color:#EFDDB6}
.pnotas{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.pnota{font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--r);background:var(--mist);color:var(--body);border:1px solid var(--rule)}
.pnota b{font-weight:800}
.pnota.b{background:var(--ambev-xl);color:var(--ambev);border-color:#C2CDF2}
.pnota.m{background:var(--wip-bg);color:#8A6212;border-color:#EFDDB6}
.pnota.r{background:#FBEBEF;color:var(--no);border-color:#F2CFD8}
.psec blockquote{border-left:3px solid var(--ambev-l);background:var(--mist);padding:11px 15px;margin:9px 0;
  font-size:12px;line-height:1.6;color:var(--body);border-radius:0 2px 2px 0}
.paper{max-width:100%;overflow-x:hidden}
.psec{min-width:0}
.ptabw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table.ptab{width:100%;border-collapse:collapse;font-size:11.5px;min-width:0}
.pnome{word-break:break-word}
.pcab{flex-wrap:wrap}
@media(max-width:640px){
  .pcab{gap:10px}.pcab img.pamb{height:17px}.pcab img.pip{height:21px}
  .pcab-t b{font-size:10px}.pcab-t span{font-size:8.5px}
  .pnum{grid-template-columns:repeat(2,1fr)}
  .pnum b{font-size:21px}
  .paper{padding:18px 14px}
  .pedit{padding:16px 13px}
  table.ptab{font-size:10.5px}
  table.ptab th,table.ptab td{padding:7px 7px}
}
table.ptab th{text-align:left;padding:8px 10px;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);border-bottom:1px solid var(--rule);background:var(--mist)}
table.ptab td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
table.ptab td.pdt{white-space:nowrap;color:var(--mute);font-size:10.5px;font-weight:600}
table.ptab td.psm{color:var(--mute);font-size:11px}
.pnota-rodape{font-size:10.5px!important;color:var(--mute)!important;margin-top:10px!important;font-style:italic}
.pedit{background:var(--mist);border:1px dashed var(--rule);border-radius:var(--r);padding:20px 22px}
.pedit>h4{color:var(--ink)}
.pcampo{margin-bottom:14px}
.pcampo label{display:block;font-size:10.5px;font-weight:800;color:var(--ink);margin-bottom:5px}
.pcampo textarea{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);
  padding:9px 12px;font-family:inherit;font-size:12px;line-height:1.55;color:var(--body);resize:vertical;min-height:40px}
.pcampo textarea:focus{outline:2px solid var(--ambev);outline-offset:-1px;border-color:var(--ambev)}
.pcampo textarea::placeholder{color:var(--mute)}
.pprint{display:none;font-size:12px;line-height:1.6;color:var(--body);white-space:pre-wrap;
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);padding:9px 12px}
.prod{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);font-size:9.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:700;text-align:center}

/* ---------- impressão do paper ---------- */
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff!important}
  body.printing header.top,body.printing nav.tabs,body.printing footer,
  body.printing .pbar,body.printing .phead,body.printing #anoAviso,
  body.printing #ov,body.printing #dw{display:none!important}
  body.printing main{padding:0!important;max-width:none!important}
  body.printing .page{display:none!important}
  body.printing #p-paper{display:block!important}
  body.printing .paper{border:0!important;padding:0!important;border-radius:0!important}
  body.printing .pedit{background:#fff!important;border:0!important;padding:0!important}
  body.printing .pcampo textarea{display:none!important}
  body.printing .pprint{display:block!important}
  body.printing .pvazio-print{display:none!important}
  body.printing .pedit-vazia{display:none!important}
  body.printing .psec,body.printing .pnum,body.printing .pident{break-inside:avoid}
  body.printing table.ptab{break-inside:auto}
  body.printing table.ptab tr{break-inside:avoid}
  body.printing .btn,body.printing .exp{display:none!important}
}

</style>
</head>

<script>
/* ============ util ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>new Intl.NumberFormat('pt-BR').format(n);
const pct=(a,b)=>b?Math.round(a/b*100):0;
const SNAP='15/10/2026';
const JM={}; D.jor.forEach(j=>JM[j.id]=j);
const AM={}; D.aco.forEach(a=>AM[a.id]=a);
const CO={'Aceito':'var(--ok)','Enviado':'var(--sent)','Declinado':'var(--no)','Não respondeu':'var(--none)'};
const RESP=new Set(['Aceito','Declinado','Não respondeu']);

/* ============ export ============ */
const REG={};
function reg(id,title,head,rows){REG[id]={title,head,rows}}
function toCSV(h,r){const q=v=>{v=v==null?'':String(v);return /[";\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '\uFEFF'+[h.map(q).join(';'),...r.map(x=>x.map(q).join(';'))].join('\r\n')}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function expCSV(id){const d=REG[id];if(!d)return;dl(new Blob([toCSV(d.head,d.rows)],{type:'text/csv;charset=utf-8'}),`Ambev_${id}_${SNAP.replace(/\//g,'-')}.csv`)}
function expXLSX(id){const d=REG[id];if(!d)return;
  if(!window.XLSX){alert('A biblioteca de Excel não carregou (verifique a conexão). O download em CSV está disponível e abre normalmente no Excel.');return}
  const ws=XLSX.utils.aoa_to_sheet([d.head,...d.rows]);
  ws['!cols']=d.head.map((h,i)=>({wch:Math.min(46,Math.max(11,...[h,...d.rows.slice(0,220).map(r=>r[i])].map(v=>String(v??'').length+2)))}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,d.title.slice(0,30).replace(/[\\\/\?\*\[\]:]/g,'-'));
  XLSX.writeFile(wb,`Ambev_${id}_${SNAP.replace(/\//g,'-')}.xlsx`)}
const expBtns=id=>`<div class="exp"><button class="btn" onclick="expXLSX('${id}')">XLSX</button><button class="btn" onclick="expCSV('${id}')">CSV</button></div>`;

/* ============ componentes ============ */
function card(t,sub,body,expId){
  return `<div class="card"><div class="ch"><div class="sp"><h3>${t}</h3>${sub?`<div class="sub">${sub}</div>`:''}</div>${expId?expBtns(expId):''}</div>${body}</div>`}
function kpi(l,n,u,d,hi){return `<div class="kpi${hi?' hi':''}"><div class="l">${l}</div><div class="n">${n}${u?`<em> ${u}</em>`:''}</div>${d?`<div class="d">${d}</div>`:''}</div>`}
function bars(items,opt={}){
  const mx=Math.max(1,...items.map(i=>i.segs?i.segs.reduce((a,s)=>a+s.v,0):i.v));
  return `<div class="bars">`+items.map(i=>{
    const tot=i.segs?i.segs.reduce((a,s)=>a+s.v,0):i.v;
    const fill=i.segs?i.segs.map(s=>`<div class="fl" style="width:${s.v/mx*100}%;background:${s.c}" title="${esc(s.n)}: ${fmt(s.v)}"></div>`).join('')
                     :`<div class="fl" style="width:${tot/mx*100}%;background:${i.c||'var(--ambev)'}"></div>`;
    return `<div class="bar${i.jid?' clk':''}"${i.jid?` onclick="ficha('${i.jid}')"`:''}><div class="lb" title="${esc(i.l)}">${i.sub?`<b>${esc(i.l)}</b> <span class="sm">${esc(i.sub)}</span>`:esc(i.l)}</div><div class="tr">${fill}</div><div class="vv">${opt.sfx?tot+opt.sfx:fmt(tot)}</div></div>`}).join('')+`</div>`}
function legend(items){return `<div class="lgd">`+items.map(i=>`<span><i style="background:${i.c}"></i>${esc(i.n)}</span>`).join('')+`</div>`}
function donut(segs,center,label){
  const tot=segs.reduce((a,s)=>a+s.v,0)||1;let off=0;const R=54,C=2*Math.PI*R;
  const arcs=segs.map(s=>{const len=s.v/tot*C,el=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${s.c}" stroke-width="21" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"><title>${esc(s.n)}: ${fmt(s.v)}</title></circle>`;off+=len;return el}).join('');
  return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0">${arcs}<text x="70" y="66" text-anchor="middle" font-size="27" font-weight="800" fill="#0D1424" letter-spacing="-1">${center}</text><text x="70" y="84" text-anchor="middle" font-size="8.5" font-weight="700" fill="#7C86A2" letter-spacing="1.2">${esc(label)}</text></svg>
  <div style="flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px">`+segs.map(s=>`<div style="display:flex;align-items:center;gap:9px;font-size:11.5px"><i style="width:9px;height:9px;border-radius:2px;background:${s.c};flex-shrink:0"></i><span style="flex:1;color:var(--body);font-weight:600">${esc(s.n)}</span><b style="color:var(--ink);font-weight:800">${fmt(s.v)}</b><span style="color:var(--mute);font-size:10.5px;min-width:34px;text-align:right">${pct(s.v,tot)}%</span></div>`).join('')+`</div></div>`}
function table(head,rows,expId,align){
  return `<div class="tw"><table><thead><tr>${head.map((h,i)=>`<th${align&&align[i]==='n'?' style="text-align:right"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${align&&align[i]==='n'?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ============ agregações ============ */
const cnt=(arr,k)=>{const m={};arr.forEach(x=>{const v=typeof k==='function'?k(x):x[k];if(v)m[v]=(m[v]||0)+1});return m};
const sortD=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
function nps(arr){const n=arr.length||1;const p=arr.filter(v=>v>=9).length,d=arr.filter(v=>v<7).length;
  return {n:arr.length,prom:p,pas:arr.filter(v=>v>=7&&v<9).length,det:d,
          media:arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0,score:Math.round((p/n*100-d/n*100)*10)/10}}

/* ---- filtro global por ano ---- */
let ANO='Todos';
const ANOS=(D.meta.anos||[]).slice().sort((a,b)=>b-a);
function noAno(x){ return ANO==='Todos' || String(x)===String(ANO) }

let REL=[],ENT=[],ENC=[],byJ={},entByJ={},encByJ={},MARCAS=[],TIPOS=[],STATUS=[],respTot=0,aceTot=0,TAXA=0,
    VEIC=[],DIMS=[],RESPS=[],NPSDIM=[],NPSGER={},NPSTOT={},COMR=[],COMA=[],CTXS=[],PVS=[],SFN=null,RANK=[],
    P0=0,SEMANO=0,COMPAR=0,FALTOU=0,QUEBRA=null;
const CORDIM={'Convite e informações':'var(--ambev)','Chegada e recepção':'var(--ambev-l)','Atendimento da equipe de imprensa':'var(--sent)','Relacionamento com a marca':'#2C6B45','Relevância do conteúdo':'#4E8E6A','Materiais pós-evento':'#B4801A','Satisfação geral':'var(--ambev-d)'};
const CORTIPO={'Convite':'var(--ambev)','Press Kit':'var(--ambev-l)','Voucher':'var(--sent)','Press Trip':'#2C6B45','Coletiva':'#B4801A'};
const K=4;

function taxaMarca(){
  const m={};REL.forEach(r=>{if(!RESP.has(r.s))return;m[r.m]=m[r.m]||{a:0,t:0};m[r.m].t++;if(r.s==='Aceito')m[r.m].a++});
  return Object.entries(m).filter(([,v])=>v.t>=8).map(([n,v])=>({n,a:v.a,t:v.t,p:pct(v.a,v.t)})).sort((a,b)=>b.p-a.p)}
function veicAgg(){
  const m={};REL.forEach(r=>{const j=JM[r.j];if(!j||!j.v)return;m[j.v]=m[j.v]||{q:0,a:0,r:0,idm:j.idm,mc:j.mc,p:new Set()};
    m[j.v].q++;m[j.v].p.add(r.j);if(RESP.has(r.s)){m[j.v].r++;if(r.s==='Aceito')m[j.v].a++}});
  return Object.entries(m).map(([v,x])=>({v,q:x.q,pes:x.p.size,tx:x.r?pct(x.a,x.r):null,idm:x.idm,mc:x.mc})).sort((a,b)=>b.q-a.q)}

/* score de relacionamento — transparente e explicável.
   A taxa de aceite usa suavização: com poucas respostas o valor puxa para a média geral,
   para não colocar em primeiro lugar quem aceitou 1 de 1 convite. */
function score(j){
  const rs=byJ[j.id]||[], resp=rs.filter(r=>RESP.has(r.s)), ace=resp.filter(r=>r.s==='Aceito').length;
  const txAj=(ace+K*P0)/(resp.length+K);
  const sA=Math.round(txAj*45);
  // volume conta ACEITES, não convites enviados: ser muito convidado e nunca comparecer não é sinal positivo
  const sV=Math.round(Math.min(ace/6,1)*25);
  const sE=Math.round(Math.min((j.qe||0)/3,1)*15);
  const sR=(j.idm?10:0)+(j.mc?5:0);
  return {t:sA+sV+sE+sR,sA,sV,sE,sR,tx:resp.length?pct(ace,resp.length):null,txAj:Math.round(txAj*100),ace,resp:resp.length,n:rs.length}}

function agrega(){
  REL = ANO==='Todos' ? D.rel : D.rel.filter(r=>noAno(r.ano));
  ENT = ANO==='Todos' ? D.ent : D.ent.filter(e=>noAno(e.y));
  ENC = ANO==='Todos' ? D.enc : D.enc.filter(e=>noAno(e.y));
  SEMANO = D.rel.filter(r=>!r.ano).length;

  byJ={}; REL.forEach(r=>(byJ[r.j]=byJ[r.j]||[]).push(r));
  entByJ={}; ENT.forEach(e=>{if(e.j)(entByJ[e.j]=entByJ[e.j]||[]).push(e)});
  encByJ={}; ENC.forEach(e=>{if(e.j)(encByJ[e.j]=encByJ[e.j]||[]).push(e)});

  MARCAS=sortD(cnt(REL,'m'));
  TIPOS=sortD(cnt(REL,'t'));
  STATUS=['Aceito','Enviado','Declinado','Não respondeu'].map(s=>({n:s,v:REL.filter(r=>r.s===s).length,c:CO[s]}));
  respTot=REL.filter(r=>RESP.has(r.s)).length;
  aceTot=REL.filter(r=>r.s==='Aceito').length;
  TAXA=pct(aceTot,respTot);
  P0=aceTot/Math.max(respTot,1);
  VEIC=veicAgg();

  // taxa de quebra: aceitou e não compareceu
  COMPAR=REL.filter(r=>r.pz==='Compareceu').length;
  FALTOU=REL.filter(r=>r.pz==='Não compareceu').length;
  QUEBRA=(COMPAR+FALTOU)?pct(FALTOU,COMPAR+FALTOU):null;

  const PES=ANO==='Todos'?D.pes:D.pes.filter(p=>noAno((p.d||'').slice(0,4)));
  DIMS=[...new Set(PES.map(p=>p.dim))];
  RESPS=[...new Set(PES.map(p=>p.r))];
  NPSDIM=DIMS.map(d=>({d,...nps(PES.filter(p=>p.dim===d).map(p=>p.nota))})).sort((a,b)=>b.score-a.score||b.media-a.media);
  NPSGER=nps(PES.filter(p=>p.dim==='Satisfação geral').map(p=>p.nota));
  NPSTOT=nps(PES.map(p=>p.nota));
  PESF=PES;
  COMR=D.com.filter(c=>c.tr==='Comentário de respondente');
  COMA=D.com.filter(c=>c.tr!=='Comentário de respondente');
  CTXS=[...new Set([...D.aco.map(a=>a.ctx),...D.ent.map(e=>e.ctx)].filter(Boolean))];
  PVS=[...new Set(ENT.map(e=>e.pv).filter(Boolean))].sort();
  SFN=D.aco.find(a=>a.nm&&a.nm.indexOf('Fight Night')>=0);

  D.jor.forEach(j=>{
    j._qa=(byJ[j.id]||[]).length; j._qe=(entByJ[j.id]||[]).length; j._qn=(encByJ[j.id]||[]).length;
    j._tt=j._qa+j._qe+j._qn; j._s=score(j);
  });
  RANK=[...D.jor].filter(j=>j._tt>0).sort((a,b)=>b._s.t-a._s.t||b._tt-a._tt);
}
let PESF=[];

/* ============ PÁGINAS ============ */
function pgVisao(){
  const semData=D.meta.acoesSemData;
  const t=taxaMarca();
  reg('marcas','Acionamentos por marca',['Marca','Acionamentos','Respondidos','Aceitos','Taxa de aceite %'],
    MARCAS.map(([m,q])=>{const x=t.find(y=>y.n===m);return [m,q,x?x.t:0,x?x.a:0,x?x.p:'']}));
  reg('status','Status dos acionamentos',['Status','Registros','% do total'],STATUS.map(s=>[s.n,s.v,pct(s.v,REL.length)]));
  reg('topjor','Jornalistas mais acionados',['Jornalista','Veículo','IDM','Morning Consult','Acionamentos','Entrevistas','Total','Aceitos','Respondidos','Taxa aceite %','Taxa ajustada %','Score'],
    [...D.jor].filter(j=>j._tt>0).sort((a,b)=>b._tt-a._tt).slice(0,80).map(j=>[j.n,j.v,j.idm?'Sim':'Não',j.mc?'Sim':'Não',j._qa,j._qe,j._tt,j._s.ace,j._s.resp,j._s.tx??'',j._s.txAj,j._s.t]));

  return `
  <div class="phead"><div><h2>Visão geral</h2>
    <p>O que a agência já registra hoje sobre o relacionamento da Ambev com a imprensa, consolidado a partir de cinco planilhas dispersas em uma base única e governada.</p></div>
    <div class="sp"></div></div>

  <div class="grid g4 mb">
    ${kpi(ANO==='Todos'?'Pessoas na base':'Pessoas acionadas em '+ANO,
      fmt(ANO==='Todos'?D.meta.nJ:new Set(REL.map(r=>r.j).concat(ENT.map(e=>e.j)).filter(Boolean)).size),'',
      ANO==='Todos'?'Jornalistas, cervejeiros e stakeholders com histórico consolidado':`De ${fmt(D.meta.nJ)} pessoas cadastradas na base`,1)}
    ${kpi(ANO==='Todos'?'Acionamentos':'Acionamentos em '+ANO,REL.length?fmt(REL.length):'—','',
      REL.length?'Convites, press kits, vouchers, press trips e coletivas':'Nenhuma ação datada neste ano ainda')}
    ${kpi('Taxa de aceite',respTot?TAXA:'—',respTot?'%':'',
      respTot?`${fmt(aceTot)} aceites em ${fmt(respTot)} convites respondidos`:'Sem convites respondidos neste recorte')}
    ${kpi('Entrevistas mapeadas',fmt(ENT.length),'',ANO==='Todos'?'2025 e 2026, por porta-voz, marca e tema':'Em '+ANO+', por porta-voz, marca e tema')}
  </div>
  ${(COMPAR+FALTOU)?`<div class="grid g4 mb">
    ${kpi('Compareceram',fmt(COMPAR),'','Presença confirmada depois do aceite')}
    ${kpi('Não compareceram',fmt(FALTOU),'','Aceitaram o convite e não apareceram')}
    ${kpi('Taxa de quebra',QUEBRA,'%','Sobre os convites com presença apurada')}
    ${kpi('Encontros presenciais',fmt(ENC.length),'','Cafés, almoços e visitas registrados')}
  </div>`:''}

  <div class="grid g23 mb">
    ${card('Acionamentos por marca','Fragmentado por tipo de iniciativa.',
      bars(MARCAS.slice(0,12).map(([m])=>({l:m,segs:TIPOS.map(([t])=>({n:t,v:REL.filter(r=>r.m===m&&r.t===t).length,c:CORTIPO[t]||'var(--none)'})).filter(s=>s.v)})))
      +legend(TIPOS.map(([t])=>({n:t,c:CORTIPO[t]||'var(--none)'}))),'marcas')}
    ${card('Como o mercado responde','Press kits e vouchers entram como “enviado” porque não têm campo de resposta na origem.',donut(STATUS,fmt(REL.length),'REGISTROS'),'status')}
  </div>

  <div class="grid g2 mb">
    ${card('Taxa de aceite por marca','Só marcas com pelo menos 8 convites respondidos. Press kits e vouchers ficam fora da conta.',
      bars(t.map(x=>({l:x.n,sub:`${x.a}/${x.t}`,v:x.p,c:'var(--ambev)'})),{sfx:'%'}),'marcas')}
    ${card('Quem a agência mais aciona','Por volume de interações registradas. Clique em um nome para abrir a ficha completa.',
      bars([...D.jor].sort((a,b)=>b._tt-a._tt).slice(0,12).map(j=>({l:j.n,sub:j.v,v:j._tt,jid:j.id})))+legend([{n:'Interações registradas (acionamentos + entrevistas)',c:'var(--ambev)'}]),'topjor')}
  </div>

  <div class="note">
    <b>Leitura importante para esta versão.</b> ${semData} das ${D.meta.nA} ações ainda não têm mês e ano preenchidos — por isso ${fmt(SEMANO)} dos ${fmt(D.rel.length)} acionamentos ficam fora quando o filtro por ano está ativo, e a linha do tempo ainda não existe. Editoria e cargo já existem para ${fmt(D.comp.ed)} pessoas; as tags de interesse, que alimentam o paper, começam a ser preenchidas agora.
  </div>`}

function pgQuem(){
  const marcas=['Todas as marcas',...MARCAS.map(m=>m[0])];
  const tipos=['Todas as iniciativas',...TIPOS.map(t=>t[0])];
  return `
  <div class="phead"><div><h2>Quem convidar?</h2>
    <p>A pergunta que a ferramenta existe para responder. Escolha a marca e a iniciativa: a base ordena os jornalistas pelo histórico real de relacionamento, não pelo volume de matérias.</p></div></div>

  <div class="rec mb2">
    <div class="q">Sobraram três convites. Quem recebe?</div>
    <div class="qs">O ranking combina taxa de aceite, aceites acumulados, entrevistas concedidas e relevância do veículo nos rankings que a Ambev acompanha.</div>
    <div class="ctl">
      <div><label>Marca</label><select id="rM">${marcas.map(m=>`<option>${esc(m)}</option>`).join('')}</select></div>
      <div><label>Iniciativa</label><select id="rT">${tipos.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div>
      <div><label>Relevância do veículo</label><select id="rV"><option>Todos os veículos</option><option>Somente IDM</option><option>Somente Morning Consult</option><option>IDM ou Morning Consult</option></select></div>
      <div class="dis"><label>Interesse pessoal</label><select disabled><option>Em preenchimento pela equipe</option></select></div>
    </div>
    <div class="rl" id="rL"></div>
    <div class="rf">Score de 0 a 100: taxa de aceite (45) · aceites acumulados (25) · entrevistas concedidas (15) · relevância do veículo (15). Convite enviado não pontua — só comparecimento. Quem tem poucos convites respondidos tem a taxa puxada para a média geral, para que um aceite isolado não vire primeiro lugar. O filtro de interesse pessoal — luta, tênis, corrida, gastronomia — entra assim que a equipe concluir o enriquecimento das fichas.</div>
  </div>

  <div class="grid g2">
    ${card('Concentração do relacionamento','Quanto do esforço de convite está indo para o mesmo grupo de pessoas.','<div id="conc"></div>')}
    ${card('Quem nunca respondeu','Pessoas acionadas mais de uma vez sem nenhum aceite registrado. Vale rever antes do próximo convite.','<div id="semret"></div>','semret')}
  </div>`}

function renderRec(){
  const m=$('#rM').value,t=$('#rT').value,v=$('#rV').value;
  let cand=D.jor.filter(j=>{
    const rs=byJ[j.id]||[];
    if(!rs.length&&!j._qe)return false;
    if(m!=='Todas as marcas'&&!rs.some(r=>r.m===m))return false;
    if(t!=='Todas as iniciativas'&&!rs.some(r=>r.t===t))return false;
    if(v==='Somente IDM'&&!j.idm)return false;
    if(v==='Somente Morning Consult'&&!j.mc)return false;
    if(v==='IDM ou Morning Consult'&&!(j.idm||j.mc))return false;
    return true});
  cand.sort((a,b)=>b._s.t-a._s.t||b._tt-a._tt);
  const top=cand.slice(0,10);
  reg('quem',`Recomendacao ${m} ${t}`,['Posição','Jornalista','Veículo','IDM','Morning Consult','Acionamentos','Aceitos','Respondidos','Taxa aceite %','Taxa ajustada %','Entrevistas','Score'],
    cand.slice(0,120).map((j,i)=>[i+1,j.n,j.v,j.idm?'Sim':'Não',j.mc?'Sim':'Não',j._qa,j._s.ace,j._s.resp,j._s.tx??'',j._s.txAj,j._qe,j._s.t]));
  $('#rL').innerHTML = top.length? top.map((j,i)=>`
    <div class="ri" onclick="ficha('${j.id}')">
      <div class="rk">${String(i+1).padStart(2,'0')}</div>
      <div><div class="nn">${esc(j.n)}</div><div class="vv">${esc(j.v||'Veículo não informado')}${j.idm?' · IDM':''}${j.mc?' · Morning Consult':''}</div></div>
      <div class="mt">${j._s.resp?`${j._s.tx}% de aceite · ${j._s.ace} de ${j._s.resp}`:'sem convite respondido'}<br>${j._tt} interações · ${j._qe} entrevistas${j._s.resp&&j._s.resp<3?' · <b style="color:#E8B54B">amostra pequena</b>':''}</div>
      <div class="sc">${j._s.t}</div>
    </div>`).join('')
    : `<div style="padding:26px;text-align:center;color:#A9B6E8;font-size:12px">Nenhuma pessoa combina com esses filtros. Tente ampliar a marca ou a iniciativa.</div>`;
}

function renderConc(){
  const tot=REL.length,ord=[...D.jor].sort((a,b)=>b.qa-a.qa);
  const acc=n=>ord.slice(0,n).reduce((a,j)=>a+j._qa,0);
  const rows=[[20,acc(20)],[50,acc(50)],[100,acc(100)]];

  <div class="sub" style="margin:14px 0 0">${pct(acc(20),tot)}% dos acionamentos ${ANO==='Todos'?'registrados':'de '+ANO} foram para 20 pessoas, em uma base de ${fmt(D.meta.nJ)}. É o dado que sustenta a conversa sobre ampliar a base de relacionamento.</div>`;

  const sr=D.jor.filter(j=>{const rs=(byJ[j.id]||[]).filter(r=>RESP.has(r.s));return rs.length>=2&&!rs.some(r=>r.s==='Aceito')})
    .map(j=>{const rs=(byJ[j.id]||[]).filter(r=>RESP.has(r.s));return{j,n:rs.length,d:rs.filter(r=>r.s==='Declinado').length}})
    .sort((a,b)=>b.n-a.n);
  reg('semret','Sem retorno',['Jornalista','Veículo','Convites respondidos','Declinados','IDM'],sr.map(x=>[x.j.n,x.j.v,x.n,x.d,x.j.idm?'Sim':'Não']));
  $('#semret').innerHTML=sr.length?table(['Jornalista','Veículo','Convites','Declinados'],
    sr.slice(0,40).map(x=>[`<span class="nm" onclick="ficha('${x.j.id}')">${esc(x.j.n)}</span> ${x.j.idm?'<span class="tag idm">IDM</span>':''}`,`<span class="sm">${esc(x.j.v)}</span>`,x.n,x.d]),null,['','','n','n'])
    :`<div class="empty">Nenhum caso registrado.</div>`;
}

function pgRel(){
  reg('veiculos','Veículos',['Veículo','Acionamentos','Pessoas','Taxa de aceite %','IDM','Morning Consult'],
    VEIC.map(v=>[v.v,v.q,v.pes,v.tx??'',v.idm?'Sim':'Não',v.mc?'Sim':'Não']));
  reg('acoes','Ações',['ID','Ação','Marca','Iniciativa','Mês','Ano','Registros'],
    D.aco.map(a=>[a.id,a.ac,a.m,a.t,a.mes||'',a.ano||'',a.q]));
  reg('base','Base completa de acionamentos',['Jornalista','Veículo','IDM','Ação','Marca','Iniciativa','Status','Experiência','Origem'],
    REL.map(r=>{const j=JM[r.j]||{};return [j.n||'',j.v||'',j.idm?'Sim':'Não',r.ac,r.m,r.t,r.s,r.ex||'',r.o]}));

  const tipoSeg=TIPOS.map(([t,q])=>({l:t,v:q}));
  const acoesTop=[...D.aco].sort((a,b)=>b.q-a.q);
  return `
  <div class="phead"><div><h2>Relacionamento</h2>
    <p>Todo convite, press kit, voucher, press trip e coletiva de 2026 em uma única base — unificada a partir de duas planilhas que viviam separadas.</p></div></div>

  <div class="grid g4 mb">
    ${kpi('Registros',fmt(REL.length),'','Uma linha por pessoa por ação')}
    ${kpi('Ações mapeadas',fmt(D.meta.nA),'','Eventos, envios e coletivas catalogados')}
    ${kpi('Veículos',fmt(VEIC.length),'','Com pelo menos um acionamento registrado')}
    ${kpi('Aceites',fmt(aceTot),'',`${TAXA}% dos convites respondidos`)}
  </div>

  <div class="grid g2 mb">
    ${card('Por tipo de iniciativa','Como o esforço se distribui entre os formatos de relacionamento.',bars(tipoSeg),'base')}
    ${card('Ações com mais convidados','As dez maiores mobilizações do ano.',bars(acoesTop.slice(0,10).map(a=>({l:a.nm,sub:a.m,v:a.q}))),'acoes')}
  </div>

  ${card('Veículos','Ordenado por volume de acionamento. Clique no cabeçalho de um veículo para ver quem responde por ele na ficha de cada jornalista.',
    `<div class="filt mb" style="margin-bottom:12px"><input class="srch" id="fv" placeholder="Buscar veículo..."><select id="fvi"><option>Todos</option><option>Somente IDM</option><option>Somente Morning Consult</option></select></div><div id="tv"></div>`,'veiculos')}

  <div class="mb2"></div>
  ${card('Base de acionamentos','Todos os ${n} registros, filtráveis. É a mesma informação que alimenta os gráficos acima.'.replace('${n}',fmt(REL.length)),
    `<div class="filt mb" style="margin-bottom:12px;align-items:flex-start">

    <div class="ch"><div class="sp">
      <h3>Monte o paper</h3>

    <div class="filt" style="margin-bottom:0">
      <div style="flex:1;min-width:260px">
        <label class="eyebrow" style="display:block;margin-bottom:5px">Jornalista</label>
        <select id="paJ" style="width:100%"><option value="">Selecione um jornalista...</option>
          ${nomes.map(j=>`<option value="${esc(j.id)}">${esc(j.n)}${j.v?' · '+esc(j.v):''}</option>`).join('')}</select>
      </div>
      <div>

        <select id="paM"><option>Todas as marcas</option>${[...new Set(D.rel.map(r=>r.m).filter(Boolean))].sort().map(m=>`<option>${esc(m)}</option>`).join('')}</select>

    </div>
  </div>

  <div id="paOut"><div class="empty" style="padding:50px;text-align:center">Selecione um jornalista acima para montar o paper.</div></div>`}

function renderPaper(){
  const id=$('#paJ').value, mk=$('#paM').value, out=$('#paOut');
  ['paPdf','paXls','paCsv','paLimpa'].forEach(b=>$('#'+b).disabled=!id);

  if(PAPER.id!==id){PAPER={id:id,campos:{}}}
  const j=JM[id];
  let rs=(byJ[id]||[]), es=(entByJ[id]||[]), ns=(encByJ[id]||[]);
  if(mk!=='Todas as marcas'){rs=rs.filter(r=>r.m===mk);es=es.filter(e=>e.m===mk);ns=ns.filter(e=>e.m===mk)}
  const s=j._s, resp=rs.filter(r=>RESP.has(r.s)), ace=resp.filter(r=>r.s==='Aceito').length;
  const tx=resp.length?pct(ace,resp.length):null;
  const porMarca=sortD(cnt(rs,'m')), porTipo=sortD(cnt(rs,'t'));
  const comp=rs.filter(r=>r.pz==='Compareceu').length, falt=rs.filter(r=>r.pz==='Não compareceu').length;
  const mud=D.hv.filter(h=>h.j===id);
  const pq=PESF.filter(p=>p.j===id), pc=D.com.filter(c=>c.j===id&&c.tr==='Comentário de respondente');
  const npsJ=pq.length?nps(pq.map(p=>p.nota)):null;

  // linha do tempo unificada
  const tl=[];
  rs.forEach(r=>{const a=AM[r.a]||{};tl.push({t:a.nm||r.ac,sub:`${r.m||''} · ${r.t||''}`,st:r.s,pz:r.pz,
    ord:(a.ano||0)*100+MES_N(a.mes),dt:a.mes?`${a.mes}/${a.ano}`:'',k:'rel'})});
  es.forEach(e=>tl.push({t:'Entrevista · '+(e.tm||'sem tema'),sub:`${e.m||''} · porta-voz ${e.pv||'—'}`,st:'',pz:'',
    ord:e.d?Number(e.d.slice(0,4))*100+Number(e.d.slice(5,7)):0,dt:e.d?e.d.split('-').reverse().join('/'):'',k:'ent'}));
  ns.forEach(e=>tl.push({t:(e.tp||'Encontro')+(e.pt?' · '+e.pt:''),sub:e.pa||'',st:'',pz:'',
    ord:e.d?Number(e.d.slice(0,4))*100+Number(e.d.slice(5,7)):0,dt:e.d?e.d.split('-').reverse().join('/'):'',k:'enc'}));
  tl.sort((a,b)=>b.ord-a.ord);

  reg('paper','Paper '+j.n,['Tipo','Item','Marca','Iniciativa','Status','Presença','Período'],
    rs.map(r=>{const a=AM[r.a]||{};return['Acionamento',r.ac,r.m,r.t,r.s,r.pz||'',a.mes?a.mes+'/'+a.ano:'']})
    .concat(es.map(e=>['Entrevista',e.tm,e.m,'Entrevista',e.pv,'',e.d]))
    .concat(ns.map(e=>['Encontro',e.pt||e.tp,e.m,e.tp,'','',e.d])));

  const tags=[];
  j.int.forEach(i=>tags.push({t:i,c:'int'}));
  if(j.time)tags.push({t:'Torce: '+j.time,c:'time'});
  if(j.mp)tags.push({t:'Marca: '+j.mp,c:'marca'});
  if(j.rest)tags.push({t:j.rest,c:'rest'});

  const campo=(k,lbl,ph)=>`<div class="pcampo"><label>${esc(lbl)}</label>
    <textarea data-pc="${k}" rows="2" placeholder="${esc(ph)}">${esc(PAPER.campos[k]||'')}</textarea></div>`;

  out.innerHTML=`
  <div class="paper" id="paperDoc">
    <div class="pcab">
      <img class="pamb" src="${$('#logoAmbSrc')?$('#logoAmbSrc').src:document.querySelector('.top img.amb').src}" alt="Ambev">
      <div class="sp"></div>
      <div class="pcab-t"><b>Paper de relacionamento com imprensa</b><span>${esc(SNAPD())}${mk!=='Todas as marcas'?' · recorte: '+esc(mk):''}${ANO!=='Todos'?' · ano '+ANO:''}</span></div>
      <img class="pip" src="${document.querySelector('footer img').src}" alt="Grupo In Press">
    </div>

    <div class="pident">
      <div class="pnome">${esc(j.n)}</div>
      <div class="pveic">${esc(j.cg||'Cargo não informado')}${j.v?' · '+esc(j.v):''}${j.ed?' · '+esc(j.ed):''}</div>
      <div class="ptags">
        ${j.idm?'<span class="tag idm">IDM</span>':''}${j.mc?'<span class="tag mc">Morning Consult</span>':''}
        <span class="tag">${esc(j.pr||'A classificar')}</span>
        <span class="tag">${esc(j.tp||'Jornalista')}</span>
        ${j.cp?'<span class="tag ok">Cadastro Genome</span>':'<span class="tag w">Sem cadastro Genome</span>'}
      </div>
      ${mud.length?`<div class="pmud"><b>Mudança de veículo registrada:</b> ${mud.map(m=>`${esc(m.va||'—')} → ${esc(m.vn||'—')}${m.ano?' ('+esc(m.mes||'')+'/'+m.ano+')':''}`).join(' · ')}. O histórico anterior está preservado.</div>`:''}
    </div>

    <div class="pnum">
      <div><b>${s.t}</b><span>Score</span></div>
      <div><b>${rs.length}</b><span>Acionamentos</span></div>
      <div><b>${ace}</b><span>Aceites</span></div>
      <div><b>${tx!=null?tx+'%':'—'}</b><span>Taxa de aceite</span></div>
      <div><b>${es.length}</b><span>Entrevistas</span></div>
      <div><b>${ns.length}</b><span>Encontros</span></div>
      ${(comp+falt)?`<div><b>${falt}</b><span>Ausências</span></div>`:''}
      ${npsJ?`<div><b>${npsJ.media.toFixed(1).replace('.',',')}</b><span>Nota média</span></div>`:''}
    </div>

    <div class="psec">
      <h4>Quem é</h4>
      ${j.bio?`<p>${esc(j.bio)}</p>`:`<p class="pvazio">Biografia ainda não preenchida na base (01_JORNALISTAS, coluna PERFIL_BIO).</p>`}
      ${j.est?`<p><b>Estilo de relacionamento:</b> ${esc(j.est)}</p>`:''}
      ${tags.length?`<div class="ptagl">${tags.map(t=>`<span class="ptag ${t.c}">${esc(t.t)}</span>`).join('')}</div>`

      ${j.cur?`<p><b>Curiosidades:</b> ${esc(j.cur)}</p>`:''}
      ${j.att?`<p class="patt"><b>Atenção:</b> ${esc(j.att)}</p>`:''}
    </div>

    <div class="pgrid2">
      <div class="psec">
        <h4>Relacionamento por marca</h4>
        ${porMarca.length?bars(porMarca.map(([n,v])=>({l:n,v}))):'<p class="pvazio">Sem acionamentos neste recorte.</p>'}
      </div>
      <div class="psec">
        <h4>Por tipo de iniciativa</h4>
        ${porTipo.length?bars(porTipo.map(([n,v])=>({l:n,v,c:CORTIPO[n]||'var(--ambev)'}))):'<p class="pvazio">Sem registros.</p>'}
      </div>
    </div>

    ${(pq.length||pc.length)?`<div class="psec">
      <h4>O que esta pessoa respondeu nas pesquisas</h4>
      <div class="pnotas">${pq.map(p=>`<span class="pnota ${p.nota>=9?'b':p.nota>=7?'m':'r'}">${esc(p.dim)}: <b>${p.nota}</b></span>`).join('')}</div>
      ${pc.map(c=>`<blockquote>${esc(c.tx)}</blockquote>`).join('')}
    </div>`:''}

    <div class="psec">
      <h4>Histórico completo <span class="pcount">${tl.length} registros</span></h4>
      ${tl.length?`<div class="ptabw"><table class="ptab"><thead><tr><th>Período</th><th>Registro</th><th>Detalhe</th><th>Status</th></tr></thead><tbody>
        ${tl.map(x=>`<tr><td class="pdt">${esc(x.dt||'—')}</td><td><b>${esc(x.t)}</b></td><td class="psm">${esc(x.sub)}</td>
          <td>${x.st?`<span class="tag ${x.st==='Aceito'?'ok':x.st==='Declinado'?'no':''}">${esc(x.st)}</span>`:`<span class="tag">${x.k==='ent'?'Entrevista':'Encontro'}</span>`}
          ${x.pz==='Não compareceu'?'<span class="tag no">não compareceu</span>':''}</td></tr>`).join('')}
      </tbody></table></div>`:'<p class="pvazio">Sem interações registradas neste recorte.</p>'}
      ${(!D.meta.acoesComData||D.meta.acoesSemData>0)?`<p class="pnota-rodape">A coluna de período fica vazia nas ações que ainda não têm mês e ano preenchidos na base.</p>`:''}
    </div>

    <div class="psec pedit">
      <h4>Preparação da conversa <span class="pcount">preenchido por você, entra no PDF</span></h4>
      ${PCAMPOS.map(c=>campo(c[0],c[1],c[2])).join('')}
    </div>

    <div class="prod">
      Documento gerado pelo painel de relacionamento com imprensa · Grupo In Press para Ambev · ${esc(SNAPD())} · circulação restrita
    </div>
  </div>`;

  out.querySelectorAll('[data-pc]').forEach(t=>{
    t.addEventListener('input',e=>{PAPER.campos[e.target.dataset.pc]=e.target.value;
      e.target.style.height='auto';e.target.style.height=(e.target.scrollHeight+2)+'px'});
    t.style.height='auto'; t.style.height=(t.scrollHeight+2)+'px';
  });
}
function MES_N(m){const L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const i=L.indexOf(String(m||'').toLowerCase());return i<0?0:i+1}
function SNAPD(){return SNAP}

function preparaPrint(){
  let n=0;
  document.querySelectorAll('#paperDoc [data-pc]').forEach(t=>{
    const v=(t.value||'').trim();
    if(!v){ t.parentNode.classList.add('pvazio-print'); return }
    t.parentNode.classList.remove('pvazio-print');
    const d=document.createElement('div'); d.className='pprint';
    d.textContent=v; t.parentNode.appendChild(d); n++;
  });
  const pe=document.querySelector('.pedit'); if(pe)pe.classList.toggle('pedit-vazia',n===0);
  document.body.classList.add('printing');
}
function limpaPrint(){
  document.body.classList.remove('printing');
  document.querySelectorAll('.pprint').forEach(e=>e.remove());
  document.querySelectorAll('.pvazio-print').forEach(e=>e.classList.remove('pvazio-print'));
  const pe=document.querySelector('.pedit'); if(pe)pe.classList.remove('pedit-vazia');
}
function imprimePaper(){
  if(!PAPER.id)return;
  preparaPrint();
  const limpa=()=>{limpaPrint();window.removeEventListener('afterprint',limpa)};
  window.addEventListener('afterprint',limpa);
  setTimeout(()=>{window.print();setTimeout(limpa,900)},80);
}

/* ============ ficha ============ */
function ficha(id){
  const j=JM[id];if(!j)return;
  const rs=byJ[id]||[],es=entByJ[id]||[],s=j._s;
  const porMarca=sortD(cnt(rs,'m')),porTipo=sortD(cnt(rs,'t'));
  const tl=rs.map(r=>{const a=AM[r.a]||{};return{t:a.nm||r.ac,m:`${r.m} · ${r.t} · ${r.s}`,c:r.s==='Aceito'?'a':r.s==='Declinado'?'d':r.s==='Não respondeu'?'x':''}})
    .concat(es.map(e=>({t:`Entrevista · ${e.tm||'sem tema'}`,m:`${e.m||''} · porta-voz ${e.pv||'—'}${e.d?' · '+e.d.split('-').reverse().join('/'):''}`,c:''})));
  reg('ficha',`Ficha ${j.n}`,['Tipo','Item','Marca','Iniciativa','Status'],
    rs.map(r=>['Acionamento',r.ac,r.m,r.t,r.s]).concat(es.map(e=>['Entrevista',e.tm,e.m,'Entrevista',e.pv])));
  $('#dw').innerHTML=`
  <div class="dh" style="position:relative">
    <button class="x" onclick="fechar()" aria-label="Fechar">×</button>
    <h4>${esc(j.n)}</h4><div class="v">${esc(j.v||'Veículo não informado')}</div>
    <div class="tg">${j.idm?'<span class="tag">IDM</span>':''}${j.mc?'<span class="tag">Morning Consult</span>':''}
      <span class="tag">${esc(j.pr||'A classificar')}</span>
      <span class="tag">${j.cp?'Cadastro Genome':'Sem cadastro Genome'}</span></div>
  </div>
  <div class="db">
    <div class="dsec"><h5>Histórico</h5>
      <div class="dstat">
        <div><div class="n">${j._qa}</div><div class="l">Acionam.</div></div>
        <div><div class="n">${s.ace}</div><div class="l">Aceites</div></div>
        <div><div class="n">${s.tx!=null?s.tx+'%':'—'}</div><div class="l">Taxa</div></div>
        <div><div class="n">${j._qe}</div><div class="l">Entrev.</div></div>
      </div></div>
    <div class="dsec"><h5>Score de relacionamento · ${s.t}/100</h5>
      <div class="pgl">
        <div class="pg"><div class="r"><b>Taxa de aceite ${s.resp?`<span class="sm">(ajustada: ${s.txAj}%)</span>`:'<span class="sm">(sem histórico de resposta)</span>'}</b><span>${s.sA}/45</span></div><div class="t"><div class="f" style="width:${s.sA/45*100}%"></div></div></div>
        <div class="pg"><div class="r"><b>Aceites acumulados <span class="sm">(${s.ace})</span></b><span>${s.sV}/25</span></div><div class="t"><div class="f" style="width:${s.sV/25*100}%"></div></div></div>
        <div class="pg"><div class="r"><b>Entrevistas concedidas</b><span>${s.sE}/15</span></div><div class="t"><div class="f" style="width:${s.sE/15*100}%"></div></div></div>
        <div class="pg"><div class="r"><b>Relevância do veículo</b><span>${s.sR}/15</span></div><div class="t"><div class="f" style="width:${s.sR/15*100}%"></div></div></div>
      </div></div>
    ${porMarca.length?`<div class="dsec"><h5>Marcas acionadas</h5>${bars(porMarca.map(([n,v])=>({l:n,v})))}</div>`:''}
    <div class="dsec"><h5>Perfil e afinidades</h5>
      ${(j.ed||j.cg||j.int.length||j.cur)?`<div style="font-size:12px">${j.cg?`<b>${esc(j.cg)}</b><br>`:''}${j.ed?esc(j.ed)+'<br>':''}${j.int.length?j.int.map(i=>`<span class="tag">${esc(i)}</span>`).join(' '):''}${j.cur?`<p style="margin-top:8px">${esc(j.cur)}</p>`:''}</div>`
        :`<div class="empty">Editoria, cargo, interesses e curiosidades ainda não preenchidos. Este é o campo que a equipe de Relações com a Mídia está completando — é o que vai permitir recomendar convidados por afinidade, e não só por histórico.</div>`}</div>
    <div class="dsec"><h5>Linha do tempo · ${tl.length} registros</h5>
      ${tl.length?`<div class="tl">${tl.map(t=>`<div class="tli ${t.c}"><div class="t">${esc(t.t)}</div><div class="m">${esc(t.m)}</div></div>`).join('')}</div>`:`<div class="empty">Sem interações registradas.</div>`}
      <div class="sub" style="margin-top:12px">As ações ainda não têm mês e ano, então a ordem acima é a de registro, não a cronológica.</div>
    </div>
    <div class="exp" style="justify-content:flex-start">${expBtns('ficha').replace('<div class="exp">','').replace('</div>','')}</div>
  </div>`;
  $('#ov').classList.add('on');$('#dw').classList.add('on');document.body.style.overflow='hidden';
}
function fechar(){$('#ov').classList.remove('on');$('#dw').classList.remove('on');document.body.style.overflow=''}

/* ============ navegação ============ */
const PAGES=[['visao','Visão geral',pgVisao],['quem','Quem convidar?',pgQuem],['rel','Relacionamento',pgRel],
  ['ent','Entrevistas',pgEnt],['nps','Pesquisas de evento',pgNps],['cob','Cobertura e prioridade',pgCob],
  ['comp','Compliance',pgComp,1],['and','Andamento',pgAnd,1],['paper','Paper',pgPaper]];
function build(ativa){
  agrega();
  const atual=ativa||($$('#tabs button[aria-selected="true"]')[0]||{dataset:{}}).dataset.k||'visao';
  $('#tabs').innerHTML=PAGES.map(([k,l,,w])=>`<button role="tab" aria-selected="${k===atual}" data-k="${k}">${w?'<i class="dot"></i>':''}${esc(l)}</button>`).join('');
  PAGES.forEach(([k,,fn])=>{$('#p-'+k).innerHTML=fn()});
  $$('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+atual));
  $$('#tabs button').forEach(b=>b.onclick=()=>{
    $$('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
    $$('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.k));
    window.scrollTo({top:0,behavior:'smooth'})});
  // filtro global por ano
  const fa=$('#anoSel');
  if(fa&&!fa.dataset.on){
    fa.innerHTML='<option>Todos</option>'+ANOS.map(a=>`<option>${a}</option>`).join('');
    fa.value=ANO; fa.dataset.on='1';
    fa.onchange=()=>{ANO=fa.value;const at=($$('#tabs button[aria-selected="true"]')[0]||{dataset:{}}).dataset.k;build(at);window.scrollTo({top:0})};
  }
  if(fa)fa.value=ANO;
  const av=$('#anoAviso');
  if(av)av.innerHTML = ANO==='Todos' ? '' : (REL.length ?
    `<b>Filtro ativo: ${ANO}.</b> ${fmt(SEMANO)} dos ${fmt(D.rel.length)} acionamentos ainda não têm mês e ano preenchidos na base e ficam de fora deste recorte. Entrevistas, encontros e pesquisas têm data própria e respondem corretamente ao filtro.`
    : `<b>Filtro ativo: ${ANO}.</b> Nenhuma ação está datada em ${ANO} na base, então as visões de acionamento aparecem vazias. ${fmt(SEMANO)} acionamentos aguardam o preenchimento de mês e ano em 02_ACOES — é o que destrava a comparação entre anos. As entrevistas de ${ANO} continuam aparecendo normalmente.`);
  if(av)av.style.display = ANO==='Todos' ? 'none' : 'block';
  // paper
  if($('#paJ')){
    $('#paJ').onchange=renderPaper; $('#paM').onchange=renderPaper;
    $('#paPdf').onclick=imprimePaper;
    $('#paXls').onclick=()=>expXLSX('paper');
    $('#paCsv').onclick=()=>expCSV('paper');
    $('#paLimpa').onclick=()=>{PAPER.campos={};renderPaper()};
    renderPaper();
  }
  ['rM','rT','rV'].forEach(id=>$('#'+id).onchange=renderRec);
  renderRec();renderConc();renderVeic();renderBase();renderEnt();
  ['fv','fvi'].forEach(id=>$('#'+id).oninput=$('#'+id).onchange=renderVeic);
  ['fb','fbm','fbs','fbt','fbv'].forEach(id=>$('#'+id).oninput=$('#'+id).onchange=renderBase);
  $('#fbc').onclick=()=>{[...$('#fbv').options].forEach(o=>o.selected=false);renderBase()};
  ['fe','fep','fey','fem'].forEach(id=>$('#'+id).oninput=$('#'+id).onchange=renderEnt);
  if($('#fec'))$('#fec').onchange=renderEnt;
  $('#ov').onclick=fechar;
  document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
  $('#snap').textContent='Dados de '+SNAP;
  $('#ft').innerHTML=`Painel construído pelo B.I. do Grupo In Press a partir da base mãe de relacionamento.<br>Versão 3 · snapshot de ${SNAP} · ${fmt(D.meta.nJ)} pessoas, ${fmt(REL.length)} acionamentos, ${fmt(ENT.length)} entrevistas. Documento de circulação restrita.`;
}

/* ============ gate ============ */
const HASH='84474ae0f45b721eaa56f236811cbcd8cee140f5cd08b2b8e931bac77032d080';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function entrar(){
  const v=$('#pw').value;
  if(!v){$('#er').textContent='Informe a senha.';return}
  let ok=false;
  try{ok=await sha(v)===HASH}catch(e){ok=false}
  if(ok){sessionStorage.setItem('ok','1');abrir()}
  else{$('#er').textContent='Senha incorreta.';$('#pw').value='';$('#pw').focus()}}
function abrir(){$('#gate').style.display='none';$('#app').classList.add('on');build()}
$('#go').onclick=entrar;
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')entrar()});
if(sessionStorage.getItem('ok')==='1')abrir(); else $('#pw').focus();



</script>
